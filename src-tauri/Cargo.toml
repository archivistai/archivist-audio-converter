[package]
name = "audio-converter"
version = "0.2.5"
description = "Drag-and-drop audio format converter"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already in the tree via tauri, but tauri enables only rt/rt-multi-thread/sync/fs/io-util.
# It builds its runtime with `Runtime::new()`, whose `enable_all()` starts the timer ONLY if
# the "time" feature is compiled in - so without this line the stall watchdog's `timeout`
# panics on first poll with "no timer running". `ffmpeg::tests::tauri_runtime_has_a_timer`
# fails if this is ever dropped.
tokio = { version = "1", features = ["time", "rt-multi-thread"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
